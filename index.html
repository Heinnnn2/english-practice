<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文單字練習</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 英文單字練習</h1>
      <div class="stats-bar">
        <div class="stat">
          <span class="stat-label">題目</span>
          <span id="questionNumber" class="stat-value">1 / 20</span>
        </div>
        <div class="progress-wrap">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <div class="stat">
          <span class="stat-label">答對</span>
          <span id="score" class="stat-value">0</span>
        </div>
      </div>
    </header>

    <main>
      <div id="questionCard" class="question-card">
        <div id="question"></div>
      </div>
      <div id="options" class="options"></div>
      <div id="result" class="result"></div>
    </main>
  </div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
